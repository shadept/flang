name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Decides whether anything the build reads changed. A change that touches
  # only docs, Markdown, LICENSE or .claude/ skips the jobs below; anything
  # else, or a base that cannot be diffed (first push, force push), builds.
  # Skipped jobs report success, so they do not block a merge.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      # History and trees only: the diff needs no file contents, and the
      # sparse checkout keeps the seeds out of the working tree.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .github

      - id: filter
        shell: bash
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null || ! files=$(git diff --name-only "$BASE...$HEAD"); then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$files"
          if grep -qvE '^(docs/|\.claude/)|\.md$|^LICENSE$' <<< "$files"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: darwin-arm64

    runs-on: ${{ matrix.os }}

    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Setup MSVC
        if: matrix.rid == 'win-x64'
        uses: ilammy/msvc-dev-cmd@v1

      # A fresh checkout has no compiler, so build.cs builds stage 1 with the
      # committed seed.
      - name: Build the seed compiler
        shell: bash
        run: |
          cd "boot/${{ matrix.rid }}"
          if [ "${{ matrix.rid }}" = "win-x64" ]; then cmd //c build.bat; else make; fi

      - name: Build compiler
        run: dotnet run build.cs ${{ matrix.rid }}

      - name: Run test harness
        run: dotnet run test.cs

  # Cold start from the committed seed (boot/<rid>/flang.c): the seed builds
  # HEAD, HEAD builds itself twice, and the results must agree. Catches seed
  # rot (HEAD outgrew the seed), fixpoint drift (self-miscompile or
  # nondeterminism), and seed-rule violations (compiler source using a
  # feature the seed lacks) in one job. Skips until the first promote
  # commits a seed. See boot/README.md and promote.cs.
  bootstrap:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: darwin-arm64

    runs-on: ${{ matrix.os }}

    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
      RID: ${{ matrix.rid }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Setup MSVC
        if: matrix.rid == 'win-x64'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build the seed compiler
        shell: bash
        run: |
          if [ ! -f "boot/$RID/flang.c" ]; then
            echo "seed=absent" >> "$GITHUB_ENV"
            echo "No committed seed for $RID yet - skipping cold start."
            exit 0
          fi
          echo "seed=present" >> "$GITHUB_ENV"
          cd "boot/$RID"
          if [ "$RID" = "win-x64" ]; then cmd //c build.bat; else make; fi

      - name: "Cold start: seed -> stage 1 -> stage 2 -> stage 3"
        if: env.seed == 'present'
        shell: bash
        run: |
          SEED="$PWD/boot/$RID/flang-seed"
          [ -f "$SEED.exe" ] && SEED="$SEED.exe"
          mkdir -p .coldstart
          cd compiler
          # Each stage runs from a copy: `flang build` writes build/flang,
          # which must not be the binary currently executing.
          "$SEED" build -r -s ../stdlib
          EXE=build/flang; [ -f build/flang.exe ] && EXE=build/flang.exe
          cp "$EXE" ../.coldstart/stage1
          ../.coldstart/stage1 build -k -r -s ../stdlib
          cp build/flang.c ../.coldstart/stage2.c
          cp "$EXE" ../.coldstart/stage2
          ../.coldstart/stage2 build -k -r -s ../stdlib
          cp build/flang.c ../.coldstart/stage3.c
          cmp ../.coldstart/stage2.c ../.coldstart/stage3.c
          echo "Fixpoint holds: seed-rooted stage 2 and stage 3 emit identical C."
